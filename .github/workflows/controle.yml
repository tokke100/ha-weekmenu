name: Controle

on:
  push:
  pull_request:

jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check weekmenu.js
          for f in js/*.js homeassistant/*.js; do node --check "$f"; done
      - name: Add-on gelijk met de app
        run: node homeassistant/maak-addon.js --check
